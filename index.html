<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🌀 MAINBOARD · FUSION · SEELE · MANA · AURA · ZEN · RUND</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #05070e;
            color: #c0d0d0;
            font-family: 'Segoe UI', 'Consolas', monospace;
            overflow: hidden;
            height: 100vh;
        }

        #app {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* ─── SIDEBAR ─────────────────────────────────────────── */
        #sidebar {
            width: 220px;
            min-width: 180px;
            background: rgba(6, 8, 16, 0.92);
            backdrop-filter: blur(12px);
            border-right: 1px solid rgba(120, 220, 150, 0.08);
            padding: 12px 10px;
            overflow-y: auto;
            z-index: 10;
            display: flex;
            flex-direction: column;
        }
        #sidebar .brand {
            font-size: 16px;
            font-weight: 300;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #7ee0a0, #d8f0c0, #b388ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(120, 220, 150, 0.06);
            margin-bottom: 10px;
        }
        .nav-section {
            margin-bottom: 8px;
        }
        .nav-section .head {
            font-size: 8px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #4a6a5a;
            padding-bottom: 3px;
            border-bottom: 1px solid rgba(120, 220, 150, 0.04);
            margin-bottom: 4px;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 11px;
            color: #8aa8a0;
            cursor: pointer;
            border-left: 2px solid transparent;
            transition: 0.15s;
        }
        .nav-item:hover {
            background: rgba(120, 220, 150, 0.04);
            color: #d0e8e0;
            border-left-color: #7ee0a0;
        }
        .nav-item .icon {
            font-size: 13px;
            width: 18px;
            text-align: center;
        }

        /* ─── STAGE ───────────────────────────────────────────── */
        #stage {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        #stage canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* ─── SEELE (Master‑Respo) ───────────────────────────── */
        #soul {
            position: absolute;
            top: 12px;
            left: 14px;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            border-radius: 14px;
            padding: 6px 14px;
            border: 1px solid rgba(179, 136, 255, 0.12);
            z-index: 15;
            pointer-events: none;
            min-width: 130px;
        }
        #soul .title {
            color: #b388ff;
            font-weight: 600;
            font-size: 9px;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #soul .title .pulse {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #8cf0d0;
            animation: heartbeat 1.8s infinite;
        }
        @keyframes heartbeat {
            0%,
            100% {
                opacity: 0.4;
                transform: scale(0.8);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }
        #soul .row {
            display: flex;
            justify-content: space-between;
            font-size: 9px;
            color: #8aa8a0;
            padding: 1px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
        }
        #soul .row .val {
            color: #a0e0b0;
            font-weight: bold;
        }
        #soul .row .gold {
            color: #f0d080;
        }

        /* ─── AURA (Status) ───────────────────────────────────── */
        #aura {
            position: absolute;
            top: 12px;
            right: 14px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border-radius: 14px;
            padding: 6px 14px;
            border: 1px solid rgba(120, 220, 150, 0.06);
            z-index: 15;
            pointer-events: none;
            text-align: right;
            min-width: 100px;
        }
        #aura .row {
            font-size: 9px;
            color: #6a8a7a;
            line-height: 1.5;
        }
        #aura .row .val {
            color: #a0e0b0;
            font-weight: bold;
        }
        #aura .row .gold {
            color: #f0d080;
        }
        #aura .row .purple {
            color: #b388ff;
        }

        /* ─── ZEN ─────────────────────────────────────────────── */
        #zen {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border-radius: 14px;
            padding: 6px 14px;
            border: 1px solid rgba(120, 220, 150, 0.06);
            z-index: 20;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 90vw;
            pointer-events: auto;
        }
        #zen input {
            background: rgba(20, 28, 20, 0.6);
            border: 1px solid rgba(120, 220, 150, 0.12);
            border-radius: 6px;
            padding: 3px 12px;
            color: #d0e8e0;
            font-family: inherit;
            font-size: 10px;
            min-width: 80px;
            flex: 1;
        }
        #zen button {
            background: rgba(20, 28, 20, 0.6);
            border: 1px solid rgba(120, 220, 150, 0.15);
            border-radius: 6px;
            padding: 3px 12px;
            color: #c0d8c8;
            font-family: inherit;
            font-size: 10px;
            cursor: pointer;
            transition: 0.2s;
        }
        #zen button:hover {
            border-color: #7ee0a0;
            color: #fff;
        }
        #zen .out {
            color: #8cf0d0;
            font-size: 9px;
            min-width: 80px;
        }

        /* ─── MANA ────────────────────────────────────────────── */
        #mana {
            position: absolute;
            bottom: 70px;
            right: 14px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(6px);
            border-radius: 14px;
            padding: 8px 12px;
            border: 1px solid rgba(120, 220, 150, 0.04);
            z-index: 15;
            max-height: 35vh;
            overflow-y: auto;
            min-width: 120px;
        }
        #mana .head {
            font-size: 9px;
            color: #f0d080;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.06);
            padding-bottom: 3px;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }
        .mana-item {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 2px 4px;
            border-radius: 4px;
            font-size: 8px;
            color: #8aa8a0;
            cursor: pointer;
            transition: 0.15s;
        }
        .mana-item:hover {
            background: rgba(120, 220, 150, 0.04);
        }
        .mana-item .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #2a3a3a;
            transition: 0.3s;
        }
        .mana-item .dot.on {
            background: #8cf0d0;
            box-shadow: 0 0 6px #8cf0d0;
        }
        .mana-item .name {
            flex: 1;
        }
        .mana-item .toggle {
            font-size: 6px;
            background: rgba(20, 28, 20, 0.4);
            border: 1px solid rgba(120, 220, 150, 0.08);
            border-radius: 4px;
            padding: 0 4px;
            color: #5a7a6a;
            cursor: pointer;
        }

        @media (max-width: 820px) {
            #sidebar {
                width: 0;
                min-width: 0;
                padding: 0;
                overflow: hidden;
                border: none;
            }
            #mana {
                bottom: 60px;
                right: 8px;
                min-width: 90px;
                padding: 4px 8px;
            }
            #soul {
                top: 8px;
                left: 8px;
                padding: 4px 10px;
                min-width: 100px;
            }
            #aura {
                top: 8px;
                right: 8px;
                padding: 4px 10px;
            }
            #zen {
                bottom: 8px;
                padding: 4px 10px;
                gap: 4px;
            }
            #zen input {
                min-width: 50px;
                font-size: 9px;
            }
        }
    </style>
</head>
<body>

    <div id="app">

        <!-- SIDEBAR (Navigation) -->
        <div id="sidebar">
            <div class="brand">🌀 MAINBOARD</div>
            <div class="nav-section">
                <div class="head">📦 MODULE</div>
                <div class="nav-item" data-target="boerse"><span class="icon">📈</span> BOERSE</div>
                <div class="nav-item" data-target="dom"><span class="icon">🏛</span> DOM</div>
                <div class="nav-item" data-target="eos"><span class="icon">🌌</span> EOS</div>
                <div class="nav-item" data-target="evo"><span class="icon">🔮</span> EVO</div>
                <div class="nav-item" data-target="markt"><span class="icon">🏪</span> MARKT</div>
                <div class="nav-item" data-target="respo"><span class="icon">🌀</span> RESPO</div>
                <div class="nav-item" data-target="tool48"><span class="icon">🛠</span> TOOL48</div>
                <div class="nav-item" data-target="holo"><span class="icon">🔺</span> HOLO</div>
                <div class="nav-item" data-target="rawator"><span class="icon">⚙</span> RAWATOR</div>
            </div>
            <div class="nav-section" style="margin-top:auto;border-top:1px solid rgba(120,220,150,0.04);padding-top:8px;">
                <div class="nav-item" id="resetBtn"><span class="icon">⟲</span> RESET</div>
            </div>
        </div>

        <!-- STAGE -->
        <div id="stage">
            <canvas id="canvas"></canvas>

            <!-- SEELE -->
            <div id="soul">
                <div class="title"><span class="pulse"></span> SEELE · MASTER</div>
                <div class="row"><span>Respo</span><span class="val" id="soulRespo">0%</span></div>
                <div class="row"><span>Gear</span><span class="gold" id="soulGear">0</span></div>
                <div class="row"><span>Zeit</span><span class="gold" id="soulTime">0.0s</span></div>
                <div class="row"><span>Plugins</span><span class="val" id="soulPlugins">0</span></div>
            </div>

            <!-- AURA -->
            <div id="aura">
                <div class="row">🌀 MODUL <span class="val" id="auraModul">ROOT</span></div>
                <div class="row">⚡ RESPO <span class="val" id="auraRespo">0%</span></div>
                <div class="row">⏱ TICK <span class="gold" id="auraTick">0</span></div>
                <div class="row">🔒 <span class="purple" id="auraLock">frei</span></div>
            </div>

            <!-- ZEN -->
            <div id="zen">
                <input id="cmdInput" placeholder="#SLIDE / #HDFRESPO / #ID" value="#SLIDE" />
                <button id="cmdBtn">RESOLVE</button>
                <span class="out" id="cmdOut"></span>
            </div>

            <!-- MANA -->
            <div id="mana">
                <div class="head">🧩 MANA <span id="manaCount">0</span></div>
                <div id="manaList"></div>
            </div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        // ================================================================
        //  FUSION · MAINBOARD · SEELE · MANA · AURA · ZEN · RUND
        //  Kombiniert: Hologramm-Szene (korrigiert) + STAGE-Commander +
        //  Plugin-Manager + Master-Respo + HDF-Resolver
        // ================================================================

        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ─── DOM REFS ──────────────────────────────────────────────────
        const canvas = document.getElementById('canvas');
        const soulRespo = document.getElementById('soulRespo');
        const soulGear = document.getElementById('soulGear');
        const soulTime = document.getElementById('soulTime');
        const soulPlugins = document.getElementById('soulPlugins');
        const auraModul = document.getElementById('auraModul');
        const auraRespo = document.getElementById('auraRespo');
        const auraTick = document.getElementById('auraTick');
        const auraLock = document.getElementById('auraLock');
        const cmdOut = document.getElementById('cmdOut');

        // ─── THREE.JS SETUP ──────────────────────────────────────────
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x05070e);
        scene.fog = new THREE.Fog(0x05070e, 8, 18);

        const camera = new THREE.PerspectiveCamera(38, canvas.clientWidth / canvas.clientHeight, 0.1, 30);
        camera.position.set(5, 3.5, 7);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.target.set(0, 0.3, 0);
        controls.minDistance = 3;
        controls.maxDistance = 16;
        controls.update();

        // ─── LIGHTS ──────────────────────────────────────────────────
        scene.add(new THREE.AmbientLight(0x222244, 0.6));
        const dLight = new THREE.DirectionalLight(0xffeedd, 2.2);
        dLight.position.set(6, 10, 8);
        dLight.castShadow = true;
        scene.add(dLight);
        scene.add(new THREE.DirectionalLight(0x4488ff, 0.5).position.set(-4, 2, -4));
        scene.add(new THREE.DirectionalLight(0x88ddff, 0.3).position.set(0, -2, 5));

        // ─── BODEN / GITTER ──────────────────────────────────────────
        const gridHelper = new THREE.GridHelper(5.5, 11, 0x44aa77, 0x226644);
        gridHelper.position.y = -0.65;
        scene.add(gridHelper);

        // ─── RESPO‑MESH (9×9) ──────────────────────────────────────
        const RESPO_SIZE = 9;
        const TOTAL = 81;
        const respoMeshes = [];
        const respoValues = new Float32Array(TOTAL);

        for (let r = 0; r < RESPO_SIZE; r++) {
            for (let c = 0; c < RESPO_SIZE; c++) {
                const idx = r * RESPO_SIZE + c;
                const x = (c / (RESPO_SIZE - 1) - 0.5) * 4.2;
                const z = (r / (RESPO_SIZE - 1) - 0.5) * 4.2;
                respoValues[idx] = 0.5 + 0.4 * Math.sin(idx * 0.15);
                const geo = new THREE.SphereGeometry(0.12, 8, 8);
                const mat = new THREE.MeshStandardMaterial({
                    color: 0x44aa77,
                    emissive: 0x226644,
                    emissiveIntensity: 0.3,
                    roughness: 0.2,
                    metalness: 0.6,
                });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(x, -0.3 + respoValues[idx] * 0.5, z);
                mesh.castShadow = true;
                scene.add(mesh);
                respoMeshes.push({ mesh, idx, x, z, value: respoValues[idx], target: respoValues[idx] });
            }
        }

        // ─── DREIECK‑SCREENS (120°-Symmetrie, korrigiert) ──────────
        const mirrorGroup = new THREE.Group();
        scene.add(mirrorGroup);

        function createMirror(color, label, angleDeg) {
            const group = new THREE.Group();
            const geo = new THREE.PlaneGeometry(1.6, 2.2);
            const mat = new THREE.MeshStandardMaterial({
                color,
                emissive: color,
                emissiveIntensity: 0.06,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.3,
                roughness: 0.1,
                metalness: 0.85,
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.castShadow = true;
            group.add(mesh);

            const edges = new THREE.EdgesGeometry(geo);
            const lineMat = new THREE.LineBasicMaterial({ color: 0x88ddbb, transparent: true, opacity: 0.25 });
            const line = new THREE.LineSegments(edges, lineMat);
            group.add(line);

            // KORREKT: position auf Kreis, rotation.y = -angle
            const angleRad = angleDeg * Math.PI / 180;
            group.position.set(Math.sin(angleRad) * 1.4, 0, Math.cos(angleRad) * 1.4);
            group.rotation.y = -angleRad;
            group.rotation.x = 0.05;

            // Label
            const c = document.createElement('canvas');
            c.width = 128;
            c.height = 48;
            const ctx = c.getContext('2d');
            ctx.fillStyle = 'rgba(0,0,0,0)';
            ctx.fillRect(0, 0, 128, 48);
            ctx.font = 'bold 18px Consolas';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#88ddbb';
            ctx.fillText(label, 64, 24);
            const tex = new THREE.CanvasTexture(c);
            const spriteMat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.scale.set(0.5, 0.18, 1);
            sprite.position.z = 0.01;
            group.add(sprite);

            mirrorGroup.add(group);
            return group;
        }

        const screenConfigs = [
            { color: 0x0088ff, label: 'BOERSE', angle: 0 },
            { color: 0xff44aa, label: 'DOM', angle: 120 },
            { color: 0x88ddff, label: 'EVO', angle: 240 },
        ];
        screenConfigs.forEach(cfg => createMirror(cfg.color, cfg.label, cfg.angle));

        // ─── PLUGIN‑DEFINITION (13 BRAIN-Dateien) ──────────────────
        const PLUGIN_NAMES = [
            'NC_figur.js', 'NC_kraft.js', 'NC_space.js', 'NC_time.js',
            'OS_CORE.js', 'axiom.map.js', 'coord.js', 'dreieck.js',
            'resolver.js', 'respo.js', 'router.js', 'vec.js', 'index.html'
        ];
        const plugins = PLUGIN_NAMES.map(name => ({
            id: name,
            name: name.replace('.js', ''),
            active: false
        }));

        // ─── MANA (Plugin‑Manager) ──────────────────────────────────
        const manaList = document.getElementById('manaList');
        const manaCount = document.getElementById('manaCount');

        function renderMana() {
            manaList.innerHTML = '';
            let activeCount = 0;
            plugins.forEach(p => {
                if (p.active) activeCount++;
                const div = document.createElement('div');
                div.className = 'mana-item';
                div.innerHTML = `
                    <span class="dot ${p.active ? 'on' : ''}"></span>
                    <span class="name">${p.name}</span>
                    <span class="toggle">${p.active ? '✕' : '+'}</span>
                `;
                div.querySelector('.toggle').addEventListener('click', (e) => {
                    e.stopPropagation();
                    p.active = !p.active;
                    renderMana();
                    updateSceneForPlugins();
                });
                manaList.appendChild(div);
            });
            manaCount.textContent = `${activeCount}/${plugins.length}`;
            soulPlugins.textContent = activeCount;
        }
        renderMana();

        // ─── PLUGIN‑EFFEKTE ──────────────────────────────────────────
        function updateSceneForPlugins() {
            const active = plugins.filter(p => p.active).length;
            const factor = 1 + (active / plugins.length) * 0.6;

            mirrorGroup.children.forEach(group => {
                const mesh = group.children[0];
                if (mesh && mesh.isMesh) {
                    mesh.material.emissiveIntensity = 0.06 + (active / plugins.length) * 0.35;
                }
            });

            respoMeshes.forEach(entry => {
                const base = 0.5 + 0.4 * Math.sin(entry.idx * 0.15);
                entry.target = Math.min(1, base * factor);
            });
        }

        // ─── HDF‑RESOLVER ────────────────────────────────────────────
        const HDF = {
            roms: { d: 'D-Basis', e: 'E-Basis', i: 'I-Basis', n: 'N-Basis', o: 'O-Basis', r: 'R-Basis',
                s: 'S-Basis', u: 'U-Basis', w: 'W-Basis' },
            resolve(cmd) {
                const key = cmd.trim().toLowerCase().replace('#', '');
                if (this.roms[key]) return { rom: key, value: this.roms[key] };
                if (cmd === '#SLIDE') return { rom: 'SLIDE', value: 'SLIDE.hdf' };
                if (cmd === '#HDFRESPO') return { rom: 'HDFRESPO', value: 'HDFRESPO.hdf' };
                if (cmd === '#ID') return { rom: 'ID', value: 'ID.hdf' };
                return null;
            }
        };
        document.getElementById('cmdBtn').addEventListener('click', () => {
            const input = document.getElementById('cmdInput').value.trim();
            const result = HDF.resolve(input);
            if (result) {
                cmdOut.textContent = `✅ ${result.rom} → ${result.value}`;
            } else {
                cmdOut.textContent = `❌ "${input}" nicht gefunden`;
            }
        });

        // ─── NAVIGATION ──────────────────────────────────────────────
        const moduleMap = {
            boerse: 'BOERSE',
            dom: 'DOM',
            eos: 'EOS',
            evo: 'EVO',
            markt: 'MARKT',
            respo: 'RESPO',
            tool48: 'TOOL48',
            holo: 'HOLO',
            rawator: 'RAWATOR'
        };

        document.querySelectorAll('.nav-item[data-target]').forEach(item => {
            item.addEventListener('click', () => {
                const target = item.dataset.target;
                auraModul.textContent = moduleMap[target] || target.toUpperCase();
                cmdOut.textContent = `📂 Modul: ${moduleMap[target] || target.toUpperCase()}`;
                document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                item.classList.add('active');
            });
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            plugins.forEach(p => p.active = false);
            renderMana();
            updateSceneForPlugins();
            auraModul.textContent = 'ROOT';
            cmdOut.textContent = '⟲ Reset';
        });

        // ─── SEELEN‑LOOP ─────────────────────────────────────────────
        let tick = 0;
        let elapsed = 0;

        function updateSoul() {
            const avg = respoMeshes.reduce((s, e) => s + e.value, 0) / TOTAL;
            soulRespo.textContent = Math.round(avg * 100) + '%';
            auraRespo.textContent = Math.round(avg * 100) + '%';
            soulTime.textContent = (elapsed / 1000).toFixed(1) + 's';
            soulGear.textContent = tick % 12;
            auraTick.textContent = tick;
        }

        // ─── ATTACK / MOVE (optional, aber integriert) ──────────────
        let attackActive = false;
        let attackTime = 0;

        function triggerAttack() {
            attackActive = true;
            attackTime = 0;
            cmdOut.textContent = '🔥 ATTACK aktiviert!';
            respoMeshes.forEach(entry => {
                entry.target = 0.1 + 0.8 * Math.random();
            });
            // Kurze Pose-Änderung: hier nur als Beispiel, könnten wir erweitern
        }

        // ─── ANIMATION LOOP ──────────────────────────────────────────
        function animate() {
            requestAnimationFrame(animate);
            tick++;
            elapsed += 16;

            // Attack-Effekt
            if (attackActive) {
                attackTime++;
                if (attackTime < 30) {
                    respoMeshes.forEach(entry => {
                        entry.target += (0.2 * Math.sin(attackTime * 0.2 + entry.idx) - entry.target) * 0.05;
                    });
                } else {
                    attackActive = false;
                    respoMeshes.forEach(entry => {
                        entry.target = 0.5 + 0.4 * Math.sin(entry.idx * 0.15 + tick * 0.01);
                    });
                    cmdOut.textContent = '⚡ Attack abgeklungen';
                }
            }

            let sum = 0;
            for (const entry of respoMeshes) {
                entry.value += (entry.target - entry.value) * 0.05;
                const score = Math.max(0, 1 - Math.abs(entry.value - 0.5) * 2);
                sum += score;
                const y = -0.3 + entry.value * 0.6;
                entry.mesh.position.set(entry.x, y, entry.z);
                const r = 0.2 + 0.6 * score;
                const g = 0.5 + 0.4 * score;
                const b = 0.8 - 0.5 * score;
                entry.mesh.material.color.setRGB(r, g, b);
                entry.mesh.scale.setScalar(0.5 + score);
            }
            const avg = sum / TOTAL;
            auraRespo.textContent = Math.round(avg * 100) + '%';

            updateSoul();
            controls.update();
            renderer.render(scene, camera);
        }

        // ─── RESIZE ──────────────────────────────────────────────────
        function resize() {
            const w = canvas.parentElement.clientWidth;
            const h = canvas.parentElement.clientHeight;
            renderer.setSize(w, h, false);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        }
        window.addEventListener('resize', resize);
        resize();

        // ─── INIT ──────────────────────────────────────────────────
        updateSceneForPlugins();
        cmdOut.textContent = '🌀 MAINBOARD · FUSION · SEELE · MANA · AURA · ZEN · RUND';
        animate();

        // ─── TASTATUR ──────────────────────────────────────────────
        document.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') document.getElementById('resetBtn').click();
            if (e.key === 's' || e.key === 'S') document.getElementById('cmdBtn').click();
            if (e.key === 'a' || e.key === 'A') triggerAttack();
        });

        console.log('🌀 MAINBOARD · FUSION geladen');
        console.log('📦 13 BRAIN-Dateien als Plugins · Master-Respo live');
        console.log('⌨️  r=Reset  s=Resolve  a=Attack');
    </script>

</body>
